<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NEON ABYSS — 3D-аквариум на Three.js</title>
  <style>
    :root {
      --cyan: #3ff8ff;
      --magenta: #ff3df2;
      --ink: #d8f6ff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #02030a;
      color: var(--ink);
      font-family: "Segoe UI", Roboto, system-ui, -apple-system, sans-serif;
    }

    #scene {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
      touch-action: none; /* жесты целиком отдаём OrbitControls */
    }

    .hud {
      position: fixed;
      z-index: 2;
      pointer-events: none;
      user-select: none;
    }

    .hud-title {
      top: clamp(14px, 3vw, 30px);
      left: clamp(16px, 3vw, 36px);
    }

    .hud-title h1 {
      margin: 0;
      font-size: clamp(20px, 3.2vw, 40px);
      font-weight: 800;
      letter-spacing: 0.3em;
      background: linear-gradient(90deg, var(--cyan), var(--magenta));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 14px rgba(63, 248, 255, 0.45));
    }

    .hud-title p {
      margin: 0.45em 0 0;
      font-size: clamp(10px, 1.1vw, 12px);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      opacity: 0.6;
    }

    .hud-hint {
      left: 50%;
      bottom: clamp(14px, 3vw, 28px);
      transform: translateX(-50%);
      padding: 0.6em 1.3em;
      font-size: 12px;
      letter-spacing: 0.05em;
      white-space: nowrap;
      border: 1px solid rgba(63, 248, 255, 0.25);
      border-radius: 999px;
      background: rgba(4, 10, 30, 0.45);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .hud-hint b { color: var(--cyan); font-weight: 600; }

    .hud-button {
      position: fixed;
      z-index: 3;
      top: clamp(14px, 3vw, 30px);
      right: clamp(16px, 3vw, 36px);
      padding: 0.65em 1.2em;
      font: inherit;
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink);
      cursor: pointer;
      border: 1px solid rgba(255, 61, 242, 0.55);
      border-radius: 999px;
      background: rgba(12, 6, 32, 0.55);
      box-shadow: 0 0 16px rgba(255, 61, 242, 0.25);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: opacity 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    .hud-button:hover { box-shadow: 0 0 26px rgba(255, 61, 242, 0.5); }
    .hud-button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
    .hud-button[aria-pressed="false"] {
      opacity: 0.6;
      border-color: rgba(216, 246, 255, 0.25);
      box-shadow: none;
    }

    .hud-error {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: 24px;
      font-size: 15px;
      line-height: 1.6;
      text-align: center;
      background: rgba(2, 3, 10, 0.92);
    }

    .hud-error[hidden] { display: none; }

    @media (max-width: 640px) {
      .hud-title h1 { letter-spacing: 0.18em; }
      .hud-hint {
        width: calc(100% - 32px);
        white-space: normal;
        text-align: center;
        border-radius: 14px;
      }
    }
  </style>
</head>
<body>
  <canvas id="scene" aria-label="Интерактивный 3D-аквариум"></canvas>

  <header class="hud hud-title">
    <h1>NEON ABYSS</h1>
    <p>биолюминесцентный аквариум</p>
  </header>
  <button id="autoRotateBtn" class="hud-button" type="button" aria-pressed="true">Авто-облёт</button>
  <div class="hud hud-hint">
    <b>Перетаскивание</b> — вращение · <b>Колесо / щипок</b> — масштаб · <b>Правая кнопка</b> — сдвиг
  </div>
  <div id="error" class="hud-error" hidden></div>

  <script>
    // Страховка: если модули Three.js не загрузились с CDN, показываем понятное сообщение
    window.addEventListener('load', () => {
      setTimeout(() => {
        const box = document.getElementById('error');
        if (window.__aquariumReady || !box.hidden) return;
        box.hidden = false;
        box.textContent = 'Не удалось загрузить Three.js с CDN. Проверьте подключение к интернету и откройте страницу в актуальном браузере.';
      }, 1500);
    });
  </script>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.187.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.187.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

    /* =====================================================================
       0. КОНФИГУРАЦИЯ И УТИЛИТЫ
       ===================================================================== */

    const TANK = { width: 10, height: 6, depth: 6.5 };          // внутренний объём резервуара
    const HALF = new THREE.Vector3(TANK.width / 2, TANK.height / 2, TANK.depth / 2);
    const SAND_LEVEL = -HALF.y + 0.45;                           // средняя высота песка
    const WATER_LEVEL = HALF.y - 0.3;                            // зеркало воды
    const STAND_HEIGHT = 0.8;
    const FLOOR_Y = -HALF.y - STAND_HEIGHT;
    const BASE_FOV = 42;

    const SWIM_FLOOR = -1.4;                 // ниже не опускаются плавники (выше кристаллов и камней)
    const SWIM_CEILING = WATER_LEVEL - 0.1;  // и не высовываются из воды
    const JELLY_BOUNDS = new THREE.Box3(     // запас под купол и длинные щупальца
      new THREE.Vector3(-HALF.x + 1.8, SWIM_FLOOR + 1.7, -HALF.z + 1.8),
      new THREE.Vector3(HALF.x - 1.8, SWIM_CEILING - 0.6, HALF.z - 1.8),
    );

    const PALETTE = { cyan: '#2ff3ff', magenta: '#ff36d9', violet: '#9d6bff', aqua: '#2bffb4' };

    // Общие uniform-объекты: обновляются раз за кадр и сразу видны во всех шейдерах
    const uTime = { value: 0 };
    const uPointScale = { value: 1 };

    // Детерминированный генератор случайных чисел: раскладка дна одинакова при каждом запуске
    function mulberry32(seed) {
      return () => {
        seed = (seed + 0x6d2b79f5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    const random = mulberry32(20261109);
    const rand = (min, max) => min + (max - min) * random();

    // Value noise + fBm для процедурного рельефа
    function hash2(x, y) {
      const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
      return s - Math.floor(s);
    }
    function valueNoise(x, y) {
      const xi = Math.floor(x), yi = Math.floor(y);
      const xf = x - xi, yf = y - yi;
      const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
      const a = hash2(xi, yi), b = hash2(xi + 1, yi);
      const c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    }
    function fbm(x, y, octaves = 4) {
      let sum = 0, amp = 0.5, freq = 1;
      for (let i = 0; i < octaves; i++) {
        sum += amp * valueNoise(x * freq, y * freq);
        freq *= 2.03;
        amp *= 0.5;
      }
      return sum;
    }

    // Высота песчаного дна в точке (x, z): барханы + рябь + подъём к задней стенке
    function sandHeight(x, z) {
      const dunes = (fbm(x * 0.32 + 4.1, z * 0.32 - 2.3) - 0.47) * 0.9;
      const ripples = Math.sin(x * 3.4 + z * 0.8 + fbm(x * 0.7, z * 0.7) * 5) * 0.03;
      const backSlope = THREE.MathUtils.smoothstep(-z, 0, HALF.z) * 0.55;
      return Math.max(SAND_LEVEL + dunes + ripples + backSlope, -HALF.y + 0.08);
    }

    // Процедурные текстуры рисуем на canvas — никаких внешних файлов
    function makeCanvasTexture(width, height, draw) {
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      draw(canvas.getContext('2d'), width, height);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }

    function randomPointIn(box, inset, out = new THREE.Vector3()) {
      return out.set(
        rand(box.min.x + inset, box.max.x - inset),
        rand(box.min.y + inset, box.max.y - inset),
        rand(box.min.z + inset, box.max.z - inset),
      );
    }

    // Мягкие «стены»: сила растёт по мере приближения точки к границе объёма
    function wallForce(p, box, margin, strength, out) {
      out.set(0, 0, 0);
      for (const axis of ['x', 'y', 'z']) {
        const m = Math.min(margin, (box.max[axis] - box.min[axis]) * 0.3);
        const lo = box.min[axis] + m;
        const hi = box.max[axis] - m;
        if (p[axis] < lo) out[axis] = Math.min((lo - p[axis]) / m, 2) * strength;
        else if (p[axis] > hi) out[axis] = -Math.min((p[axis] - hi) / m, 2) * strength;
      }
      return out;
    }

    /* =====================================================================
       1. ИНИЦИАЛИЗАЦИЯ: рендерер, сцена, камера, управление, постобработка
       ===================================================================== */

    const canvas = document.getElementById('scene');
    const errorBox = document.getElementById('error');

    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ canvas, powerPreference: 'high-performance' });
    } catch (error) {
      errorBox.hidden = false;
      errorBox.textContent = 'Браузер или видеокарта не поддерживает WebGL 2 — аквариум не может быть отрисован.';
      throw error;
    }
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFShadowMap;

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(BASE_FOV, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(1.5, 3.2, 15);

    const controls = new OrbitControls(camera, canvas);
    controls.target.set(0, -0.4, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 9;
    controls.maxDistance = 30;
    controls.minPolarAngle = 0.06 * Math.PI;
    controls.maxPolarAngle = 0.52 * Math.PI;   // не заглядываем под «пол»
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.35;
    controls.update();

    // Постобработка: сцена (с MSAA) → bloom для неонового свечения → тонмаппинг и sRGB
    const composer = new EffectComposer(
      renderer,
      new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 }),
    );
    composer.addPass(new RenderPass(scene, camera));
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.85, 0.5, 0.22);
    composer.addPass(bloomPass);
    composer.addPass(new OutputPass());

    /* =====================================================================
       2. ОКРУЖЕНИЕ: градиентный фон, неоновые отражения, сетка-пол, подиум
       ===================================================================== */

    // Фон: огромная сфера с вертикальным градиентом «глубины» и свечением у горизонта
    const background = new THREE.Mesh(
      new THREE.SphereGeometry(400, 48, 24),
      new THREE.ShaderMaterial({
        side: THREE.BackSide,
        depthWrite: false,
        uniforms: {
          uTime,
          uTop: { value: new THREE.Color('#0b2350') },
          uMid: { value: new THREE.Color('#050b22') },
          uBottom: { value: new THREE.Color('#010208') },
          uGlow: { value: new THREE.Color('#3b1670') },
        },
        vertexShader: /* glsl */ `
          varying vec3 vDir;
          void main() {
            vDir = normalize(position);
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }`,
        fragmentShader: /* glsl */ `
          uniform float uTime;
          uniform vec3 uTop, uMid, uBottom, uGlow;
          varying vec3 vDir;
          void main() {
            float h = normalize(vDir).y;
            vec3 color = mix(uMid, uTop, smoothstep(0.05, 0.85, h));
            color = mix(color, uBottom, 1.0 - smoothstep(-0.45, 0.0, h));
            color += uGlow * exp(-abs(h - 0.04) * 7.0) * (0.55 + 0.08 * sin(uTime * 0.4));
            gl_FragColor = vec4(color, 1.0);
          }`,
      }),
    );
    background.renderOrder = -10;
    scene.add(background);

    // Карта окружения: тёмная «комната» с неоновыми панелями → PMREM (отражения в металле и чешуе)
    function createNeonEnvironment() {
      const envScene = new THREE.Scene();
      envScene.background = new THREE.Color('#03040c');
      const addPanel = (color, power, w, h, x, y, z) => {
        const panel = new THREE.Mesh(
          new THREE.PlaneGeometry(w, h),
          new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(power), side: THREE.DoubleSide }),
        );
        panel.position.set(x, y, z);
        panel.lookAt(0, 0, 0);
        envScene.add(panel);
      };
      addPanel(PALETTE.cyan, 6, 8, 0.8, -9, 5, 7);
      addPanel(PALETTE.magenta, 6, 0.8, 9, 10, 1, -5);
      addPanel(PALETTE.violet, 4, 12, 1.2, 0, 10, -8);
      addPanel('#ffffff', 2.5, 5, 5, 2, 12, 3);
      const pmrem = new THREE.PMREMGenerator(renderer);
      const envMap = pmrem.fromScene(envScene, 0.035).texture;
      pmrem.dispose();
      return envMap;
    }
    scene.environment = createNeonEnvironment();
    scene.environmentIntensity = 0.55;

    // Неоновая сетка-пол в духе synthwave: рисуется аддитивно и растворяется вдали
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(220, 220),
      new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        uniforms: {
          uTime,
          uNear: { value: new THREE.Color(PALETTE.cyan) },
          uFar: { value: new THREE.Color(PALETTE.magenta) },
        },
        vertexShader: /* glsl */ `
          varying vec2 vXZ;
          void main() {
            vec4 wp = modelMatrix * vec4(position, 1.0);
            vXZ = wp.xz;
            gl_Position = projectionMatrix * viewMatrix * wp;
          }`,
        fragmentShader: /* glsl */ `
          uniform float uTime;
          uniform vec3 uNear, uFar;
          varying vec2 vXZ;
          float gridLines(vec2 p) {
            vec2 g = abs(fract(p - 0.5) - 0.5) / fwidth(p);
            return 1.0 - min(min(g.x, g.y), 1.0);
          }
          void main() {
            float d = length(vXZ);
            float lines = gridLines(vXZ * 0.5) * 0.45 + gridLines(vXZ * 0.1) * 0.9;
            float fade = exp(-d * 0.05);
            float wave = 0.6 + 0.4 * sin(d * 0.45 - uTime * 1.3);
            vec3 color = mix(uNear, uFar, smoothstep(8.0, 40.0, d));
            float glow = exp(-d * 0.22) * 0.25;
            gl_FragColor = vec4(color * (lines * fade * wave * 0.9 + glow), 1.0);
          }`,
      }),
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = FLOOR_Y;
    floor.renderOrder = -5;
    scene.add(floor);

    // Подиум из тёмного металла с неоновыми полосами
    const stand = new THREE.Mesh(
      new THREE.BoxGeometry(TANK.width + 0.7, STAND_HEIGHT, TANK.depth + 0.7),
      new THREE.MeshStandardMaterial({ color: '#0b0e1c', metalness: 0.9, roughness: 0.35 }),
    );
    stand.position.y = -HALF.y - STAND_HEIGHT / 2;
    stand.receiveShadow = true;
    scene.add(stand);

    function addNeonStrip(color, y, power) {
      const strip = new THREE.Mesh(
        new THREE.BoxGeometry(TANK.width + 0.74, 0.05, TANK.depth + 0.74),
        new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(power) }),
      );
      strip.position.y = y;
      scene.add(strip);
    }
    addNeonStrip(PALETTE.cyan, -HALF.y - STAND_HEIGHT * 0.55, 4);
    addNeonStrip(PALETTE.magenta, -HALF.y - 0.06, 3);

    /* =====================================================================
       3. РЕЗЕРВУАР: стекло с френелем и неоновыми рёбрами, вода, лучи света
       ===================================================================== */

    const GLASS_VERTEX = /* glsl */ `
      varying vec3 vWorldPos;
      varying vec3 vWorldNormal;
      varying vec3 vLocal;
      void main() {
        vLocal = position;
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWorldPos = wp.xyz;
        vWorldNormal = normalize(mat3(modelMatrix) * normal);
        gl_Position = projectionMatrix * viewMatrix * wp;
      }`;

    const GLASS_FRAGMENT = /* glsl */ `
      uniform float uTime;
      uniform float uInner;
      uniform vec3 uHalf;
      uniform vec3 uEdge;
      uniform vec3 uGlowLow;
      uniform vec3 uGlowHigh;
      varying vec3 vWorldPos;
      varying vec3 vWorldNormal;
      varying vec3 vLocal;
      void main() {
        vec3 N = normalize(vWorldNormal) * (gl_FrontFacing ? 1.0 : -1.0);
        vec3 V = normalize(cameraPosition - vWorldPos);
        float fresnel = pow(1.0 - clamp(dot(N, V), 0.0, 1.0), 3.0);

        // стилизованные отражения неоновых ламп
        vec3 R = reflect(-V, N);
        float bands = smoothstep(0.9, 1.0, sin(atan(R.z, R.x) * 2.0 + 0.8)) * smoothstep(-0.1, 0.6, R.y);

        // свечение рёбер: среднее из трёх расстояний до граней = расстояние до ближайшего ребра
        vec3 d = uHalf - abs(vLocal);
        float edgeDist = d.x + d.y + d.z - min(d.x, min(d.y, d.z)) - max(d.x, max(d.y, d.z));
        float edge = exp(-edgeDist * 14.0);

        // мягкий внутренний свет дальних стенок: магента у дна → синий у поверхности
        float h = clamp(vLocal.y / (2.0 * uHalf.y) + 0.5, 0.0, 1.0);
        vec3 inner = mix(uGlowLow, uGlowHigh, h) * (1.0 - 0.6 * h)
                   * (0.85 + 0.15 * sin(uTime * 0.6)) * 0.16 * uInner;

        vec3 color = vec3(0.45, 0.8, 1.0) * fresnel * 0.35
                   + vec3(0.85, 0.95, 1.0) * bands * 0.16
                   + uEdge * edge * 1.5
                   + inner;
        float alpha = clamp(0.05 + fresnel * 0.35 + edge * 0.5, 0.0, 0.9);
        gl_FragColor = vec4(color, alpha);   // premultiplied: блики добавляются, alpha приглушает фон
      }`;

    function createGlassMaterial(side, innerGlow) {
      return new THREE.ShaderMaterial({
        side,
        transparent: true,
        depthWrite: false,
        premultipliedAlpha: true,
        uniforms: {
          uTime,
          uInner: { value: innerGlow },
          uHalf: { value: HALF },
          uEdge: { value: new THREE.Color('#6ff7ff') },
          uGlowLow: { value: new THREE.Color(PALETTE.magenta) },
          uGlowHigh: { value: new THREE.Color('#2a4dff') },
        },
        vertexShader: GLASS_VERTEX,
        fragmentShader: GLASS_FRAGMENT,
      });
    }

    // Сначала рисуем дальние (внутренние) стенки, обитателей — между ними, ближние — последними
    const glassGeometry = new THREE.BoxGeometry(TANK.width, TANK.height, TANK.depth);
    const glassBack = new THREE.Mesh(glassGeometry, createGlassMaterial(THREE.BackSide, 1));
    glassBack.renderOrder = -1;
    const glassFront = new THREE.Mesh(glassGeometry, createGlassMaterial(THREE.FrontSide, 0));
    glassFront.renderOrder = 10;
    scene.add(glassBack, glassFront);

    // Поверхность воды: волны в вершинном шейдере, френель и блики во фрагментном
    const waterGeometry = new THREE.PlaneGeometry(TANK.width - 0.02, TANK.depth - 0.02, 100, 64);
    waterGeometry.rotateX(-Math.PI / 2);
    const water = new THREE.Mesh(
      waterGeometry,
      new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        side: THREE.DoubleSide,
        uniforms: {
          uTime,
          uDeep: { value: new THREE.Color('#0a3a6b') },
          uShallow: { value: new THREE.Color('#46f4ff') },
        },
        vertexShader: /* glsl */ `
          uniform float uTime;
          varying vec3 vWorldPos;
          varying vec2 vXZ;
          void main() {
            vec3 p = position;
            p.y += sin(p.x * 1.4 + uTime * 1.2) * 0.035
                 + sin(p.z * 1.9 - uTime * 0.9) * 0.028
                 + sin((p.x + p.z) * 3.1 + uTime * 1.9) * 0.012;
            vXZ = p.xz;
            vec4 wp = modelMatrix * vec4(p, 1.0);
            vWorldPos = wp.xyz;
            gl_Position = projectionMatrix * viewMatrix * wp;
          }`,
        fragmentShader: /* glsl */ `
          uniform float uTime;
          uniform vec3 uDeep;
          uniform vec3 uShallow;
          varying vec3 vWorldPos;
          varying vec2 vXZ;
          void main() {
            vec2 p = vXZ;
            float t = uTime;
            // нормаль = производные тех же синусоид + мелкая рябь
            float dx = cos(p.x * 1.4 + t * 1.2) * 0.049 + cos((p.x + p.y) * 3.1 + t * 1.9) * 0.037;
            float dz = cos(p.y * 1.9 - t * 0.9) * 0.053 + cos((p.x + p.y) * 3.1 + t * 1.9) * 0.037;
            dx += sin(p.x * 9.0 + p.y * 4.0 + t * 3.0) * 0.04;
            dz += sin(p.y * 8.0 - p.x * 5.0 + t * 2.6) * 0.04;
            vec3 N = normalize(vec3(-dx, 1.0, -dz));
            vec3 V = normalize(cameraPosition - vWorldPos);
            if (V.y < 0.0) N.y = -N.y;   // смотрим на воду снизу
            float fresnel = pow(1.0 - clamp(abs(dot(N, V)), 0.0, 1.0), 3.0);
            vec3 L = normalize(vec3(0.3, 1.0, 0.25));
            float spec = pow(max(dot(N, normalize(L + V)), 0.0), 140.0);
            float sparkle = pow(abs(sin(p.x * 6.0 + t) * sin(p.y * 7.0 - t * 1.3)), 16.0);
            vec3 color = mix(uDeep, uShallow, fresnel) + spec * 1.8 + uShallow * sparkle * 0.25;
            float alpha = clamp(0.16 + fresnel * 0.5 + spec * 0.6 + sparkle * 0.1, 0.0, 0.92);
            gl_FragColor = vec4(color, alpha);
          }`,
      }),
    );
    water.position.y = WATER_LEVEL;
    water.renderOrder = 1;
    scene.add(water);

    // Лучи света сквозь толщу воды: конусы с мягкими краями и медленным мерцанием
    const shaftMaterial = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      uniforms: { uTime, uColor: { value: new THREE.Color('#8fe9ff') } },
      vertexShader: /* glsl */ `
        varying float vHeight;
        varying float vFacing;
        varying float vSeed;
        void main() {
          vHeight = uv.y;
          vec4 wp = modelMatrix * vec4(position, 1.0);
          vec3 n = normalize(mat3(modelMatrix) * normal);
          vFacing = abs(dot(n, normalize(cameraPosition - wp.xyz)));
          vSeed = modelMatrix[3].x * 1.37 + modelMatrix[3].z * 0.71;
          gl_Position = projectionMatrix * viewMatrix * wp;
        }`,
      fragmentShader: /* glsl */ `
        uniform float uTime;
        uniform vec3 uColor;
        varying float vHeight;
        varying float vFacing;
        varying float vSeed;
        void main() {
          float soft = pow(vFacing, 3.0);
          float fade = smoothstep(0.0, 0.9, vHeight);
          float flicker = 0.7 + 0.3 * sin(uTime * 0.7 + vSeed * 5.0) * sin(uTime * 1.13 + vSeed * 2.0);
          gl_FragColor = vec4(uColor * soft * fade * flicker * 0.11, 1.0);
        }`,
    });
    const shaftHeight = WATER_LEVEL - SAND_LEVEL;
    for (const [x, z, r] of [[-2.8, -0.6, 0.55], [-0.6, 0.6, 0.7], [1.6, -0.9, 0.6], [3.2, 0.8, 0.5], [0.4, -1.8, 0.45]]) {
      const shaft = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.55, r * 1.6, shaftHeight, 24, 1, true), shaftMaterial);
      shaft.position.set(x, WATER_LEVEL - shaftHeight / 2, z);
      shaft.rotation.set(rand(-0.08, 0.08), 0, rand(-0.12, 0.12));
      scene.add(shaft);
    }

    /* =====================================================================
       4. ОСВЕЩЕНИЕ: мягкий ambient, «лампа» над водой, неоновые акценты
       ===================================================================== */

    scene.add(new THREE.AmbientLight('#25336b', 0.9));
    scene.add(new THREE.HemisphereLight('#3d7bff', '#2b0a3d', 0.8));

    // Холодный направленный свет «лампы» сверху — он же отбрасывает тени рыб на песок
    const lampLight = new THREE.DirectionalLight('#9feaff', 2.4);
    lampLight.position.set(2.5, 12, 3.5);
    lampLight.castShadow = true;
    lampLight.shadow.mapSize.set(1024, 1024);
    Object.assign(lampLight.shadow.camera, { left: -7, right: 7, top: 7, bottom: -7, near: 2, far: 30 });
    lampLight.shadow.camera.updateProjectionMatrix();
    lampLight.shadow.bias = -0.0005;
    lampLight.shadow.normalBias = 0.02;
    lampLight.shadow.radius = 3;
    scene.add(lampLight);

    // Неоновая подсветка в заднем углу резервуара
    const neonBacklight = new THREE.PointLight(PALETTE.magenta, 14, 16, 1.5);
    neonBacklight.position.set(-3.5, 2.2, -2.6);
    scene.add(neonBacklight);

    /* =====================================================================
       5. ДНО: рельефный песок с каустикой, камни, кристаллы, водоросли
       ===================================================================== */

    // GLSL-каустика: две анимированные ячеистые (Voronoi) сетки, их рёбра — водные блики
    const CAUSTICS_GLSL = /* glsl */ `
      vec2 causticHash(vec2 p) {
        p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)));
        return fract(sin(p) * 43758.5453);
      }
      float causticCells(vec2 x, float t) {
        vec2 n = floor(x);
        vec2 f = fract(x);
        float d1 = 8.0;
        float d2 = 8.0;
        for (int j = -1; j <= 1; j++) {
          for (int i = -1; i <= 1; i++) {
            vec2 g = vec2(float(i), float(j));
            vec2 o = 0.5 + 0.45 * sin(t + 6.2831 * causticHash(n + g));
            float d = length(g + o - f);
            if (d < d1) { d2 = d1; d1 = d; } else if (d < d2) { d2 = d; }
          }
        }
        return d2 - d1;
      }
      float caustics(vec2 p, float t) {
        float a = causticCells(p + vec2(t * 0.07, t * 0.04), t * 0.7);
        float b = causticCells(p * 1.7 + vec2(-t * 0.05, t * 0.08) + 5.3, t * 0.9);
        float la = pow(1.0 - smoothstep(0.0, 0.16, a), 3.0);
        float lb = pow(1.0 - smoothstep(0.0, 0.16, b), 3.0);
        return la * 0.65 + lb * 0.45 + la * lb * 1.2;
      }`;

    // Подмешиваем каустику в стандартный PBR-материал (только на поверхности, смотрящие вверх)
    function addCaustics(material, strength) {
      material.onBeforeCompile = (shader) => {
        shader.uniforms.uTime = uTime;
        shader.uniforms.uCausticStrength = { value: strength };
        shader.uniforms.uCausticColor = { value: new THREE.Color('#62f4ff') };
        shader.vertexShader = shader.vertexShader
          .replace('#include <common>', '#include <common>\nvarying vec3 vCausticPos;\nvarying vec3 vCausticNormal;')
          .replace('#include <project_vertex>', `#include <project_vertex>
            vCausticPos = (modelMatrix * vec4(transformed, 1.0)).xyz;
            vCausticNormal = normalize(mat3(modelMatrix) * objectNormal);`);
        shader.fragmentShader = shader.fragmentShader
          .replace('#include <common>', `#include <common>
            uniform float uTime;
            uniform float uCausticStrength;
            uniform vec3 uCausticColor;
            varying vec3 vCausticPos;
            varying vec3 vCausticNormal;
            ${CAUSTICS_GLSL}`)
          .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
            float causticMask = smoothstep(0.2, 0.9, normalize(vCausticNormal).y);
            totalEmissiveRadiance += uCausticColor * caustics(vCausticPos.xz * 0.9, uTime)
                                   * causticMask * uCausticStrength;`);
      };
    }

    // Песок: верх «коробки» смещаем по карте высот, боковые грани дают видимый срез грунта
    function createSand() {
      const geometry = new THREE.BoxGeometry(TANK.width - 0.02, 1, TANK.depth - 0.02, 160, 1, 104);
      const pos = geometry.attributes.position;
      const colors = new Float32Array(pos.count * 3);
      const low = new THREE.Color('#1c1238');
      const high = new THREE.Color('#5a4a86');
      const deep = new THREE.Color('#07040f');
      const c = new THREE.Color();
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i), z = pos.getZ(i);
        if (pos.getY(i) > 0) {
          const h = sandHeight(x, z);
          pos.setY(i, h);
          const k = THREE.MathUtils.clamp((h - SAND_LEVEL + 0.4) / 1.3, 0, 1);
          c.copy(low).lerp(high, k).multiplyScalar(0.85 + hash2(x * 40, z * 40) * 0.3);   // зернистость
        } else {
          pos.setY(i, -HALF.y + 0.005);
          c.copy(deep);
        }
        colors.set([c.r, c.g, c.b], i * 3);
      }
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      geometry.computeVertexNormals();
      const material = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95, metalness: 0 });
      addCaustics(material, 0.9);
      const sand = new THREE.Mesh(geometry, material);
      sand.receiveShadow = true;
      return sand;
    }
    scene.add(createSand());

    // Камни: икосаэдр, «помятый» шумом, с гранёным (flat) затенением
    function createRockGeometry(radius) {
      const geometry = new THREE.IcosahedronGeometry(radius, 1);
      const pos = geometry.attributes.position;
      const v = new THREE.Vector3();
      for (let i = 0; i < pos.count; i++) {
        v.fromBufferAttribute(pos, i);
        v.multiplyScalar(0.72 + fbm(v.x * 2.1 + v.y * 1.3 + 7, v.z * 2.1 - v.y * 0.7 + 3, 3) * 0.6);
        pos.setXYZ(i, v.x, v.y * 0.62, v.z);
      }
      geometry.computeVertexNormals();
      return geometry;
    }
    const rockMaterial = new THREE.MeshStandardMaterial({ color: '#1a1830', roughness: 0.85, metalness: 0.1, flatShading: true });
    addCaustics(rockMaterial, 0.7);
    for (const [x, z, r] of [[-2.2, -0.5, 0.55], [1.2, 0.9, 0.4], [3.4, 0.3, 0.6], [-0.5, -1.7, 0.7], [-4.0, 2.2, 0.35], [2.3, 2.3, 0.3], [-1.3, 2.0, 0.28]]) {
      const rock = new THREE.Mesh(createRockGeometry(r), rockMaterial);
      rock.position.set(x, sandHeight(x, z) + r * 0.12, z);
      rock.rotation.y = rand(0, Math.PI * 2);
      rock.castShadow = true;
      rock.receiveShadow = true;
      scene.add(rock);
    }

    // Неоновые кристаллы: шестигранная призма с острой вершиной (профиль вращения из 6 сегментов)
    function createCrystalGeometry(radius, height) {
      return new THREE.LatheGeometry([
        new THREE.Vector2(0, -0.2 * height),
        new THREE.Vector2(radius, -0.2 * height),
        new THREE.Vector2(radius * 1.08, 0.62 * height),
        new THREE.Vector2(0, height),
      ], 6);
    }

    class CrystalCluster {
      constructor(x, z, color, count, height) {
        this.group = new THREE.Group();
        this.group.position.set(x, sandHeight(x, z), z);
        this.material = new THREE.MeshStandardMaterial({
          color: new THREE.Color(color).multiplyScalar(0.3),
          emissive: color,
          emissiveIntensity: 1.6,
          roughness: 0.18,
          metalness: 0.25,
          flatShading: true,
        });
        for (let i = 0; i < count; i++) {
          const h = height * (i === 0 ? 1 : rand(0.35, 0.8));
          const crystal = new THREE.Mesh(createCrystalGeometry(h * rand(0.11, 0.16), h), this.material);
          const angle = rand(0, Math.PI * 2);
          const dist = i === 0 ? 0 : rand(0.12, 0.5);
          const cx = Math.cos(angle) * dist, cz = Math.sin(angle) * dist;
          crystal.position.set(cx, sandHeight(x + cx, z + cz) - this.group.position.y, cz);
          // наклоняем кристалл наружу от центра друзы
          const tilt = i === 0 ? rand(0, 0.12) : rand(0.25, 0.7);
          crystal.quaternion.setFromAxisAngle(new THREE.Vector3(Math.sin(angle), 0, -Math.cos(angle)), tilt);
          crystal.rotateY(rand(0, Math.PI));
          crystal.castShadow = true;
          this.group.add(crystal);
        }
        this.light = new THREE.PointLight(color, 5, 6, 2);
        this.light.position.y = height * 0.55;
        this.group.add(this.light);
        this.phase = rand(0, Math.PI * 2);
        this.speed = rand(0.8, 1.4);
      }

      // «Дыхание» свечения кристаллов вместе с их точечным светом
      update(t) {
        const pulse = 0.78 + 0.22 * Math.sin(t * this.speed + this.phase) + 0.06 * Math.sin(t * 3.7 + this.phase);
        this.material.emissiveIntensity = 1.6 * pulse;
        this.light.intensity = 5 * pulse;
      }
    }

    const crystals = [
      new CrystalCluster(-2.9, 1.2, PALETTE.cyan, 7, 1.0),
      new CrystalCluster(2.9, -1.2, PALETTE.magenta, 8, 0.95),
      new CrystalCluster(0.7, 1.7, PALETTE.violet, 5, 0.7),
    ];
    crystals.forEach((cluster) => scene.add(cluster.group));

    // Водоросли: закрученная лента в форме листа; атрибут aBend — 0 у основания, 1 на кончике
    function createRibbonGeometry(height, width, twist) {
      const geometry = new THREE.PlaneGeometry(width, height, 1, 40);
      geometry.translate(0, height / 2, 0);
      const pos = geometry.attributes.position;
      const bend = new Float32Array(pos.count);
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i), y = pos.getY(i);
        const t = y / height;
        const w = Math.pow(Math.max(Math.sin(Math.PI * (0.08 + 0.92 * t)), 0), 0.6);
        const angle = t * twist;
        pos.setXYZ(i, x * w * Math.cos(angle), y, x * w * Math.sin(angle));
        bend[i] = t;
      }
      geometry.setAttribute('aBend', new THREE.BufferAttribute(bend, 1));
      geometry.computeVertexNormals();
      return geometry;
    }

    // Материал водорослей: покачивание в вершинном шейдере, градиент свечения и бегущие импульсы
    function createKelpMaterial(color) {
      const material = new THREE.MeshStandardMaterial({
        color: '#06161a',
        emissive: color,
        roughness: 0.5,
        metalness: 0.1,
        side: THREE.DoubleSide,
      });
      material.onBeforeCompile = (shader) => {
        shader.uniforms.uTime = uTime;
        shader.vertexShader = shader.vertexShader
          .replace('#include <common>', `#include <common>
            uniform float uTime;
            attribute float aBend;
            varying float vBend;
            varying float vPhase;`)
          .replace('#include <begin_vertex>', `#include <begin_vertex>
            float phase = modelMatrix[3].x * 1.7 + modelMatrix[3].z * 2.3;
            float sway = aBend * aBend;
            transformed.x += (sin(uTime * 1.1 + phase + aBend * 2.6) * 0.3
                           + sin(uTime * 2.3 + phase * 1.3 + aBend * 6.0) * 0.05) * sway;
            transformed.z += cos(uTime * 0.8 + phase * 0.7 + aBend * 2.0) * 0.18 * sway;
            vBend = aBend;
            vPhase = phase;`);
        shader.fragmentShader = shader.fragmentShader
          .replace('#include <common>', `#include <common>
            uniform float uTime;
            varying float vBend;
            varying float vPhase;`)
          .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
            float pulse = smoothstep(0.92, 1.0, sin(vBend * 9.0 - uTime * 2.2 + vPhase));
            totalEmissiveRadiance *= mix(0.05, 1.3, pow(vBend, 1.3)) + pulse * 1.5;`);
      };
      return material;
    }

    const kelpMaterials = [createKelpMaterial(PALETTE.aqua), createKelpMaterial(PALETTE.magenta), createKelpMaterial(PALETTE.violet)];
    const kelpGroves = [
      [-4.2, -2.4, 0], [-3.2, -2.6, 0], [-1.6, -2.6, 2], [1.4, -2.5, 0], [2.4, -2.7, 1], [4.1, -2.4, 0],
      [-4.3, 0.6, 1], [4.3, 1.0, 2], [-4.2, 2.3, 0], [4.2, -0.6, 1],
    ];
    for (const [gx, gz, materialIndex] of kelpGroves) {
      const blades = 3 + Math.floor(rand(0, 3));
      for (let i = 0; i < blades; i++) {
        // запас 0.6 от стекла: кончики качаются и не должны «протыкать» стенки
        const x = THREE.MathUtils.clamp(gx + rand(-0.35, 0.35), -HALF.x + 0.6, HALF.x - 0.6);
        const z = THREE.MathUtils.clamp(gz + rand(-0.3, 0.3), -HALF.z + 0.6, HALF.z - 0.6);
        const height = gz < -2 ? rand(2.2, 3.8) : rand(1.4, 2.6);
        const kelp = new THREE.Mesh(createRibbonGeometry(height, rand(0.16, 0.28), rand(2, 6)), kelpMaterials[materialIndex]);
        kelp.position.set(x, sandHeight(x, z) - 0.05, z);
        kelp.rotation.y = rand(0, Math.PI * 2);
        scene.add(kelp);
      }
    }

    /* =====================================================================
       6. ЧАСТИЦЫ: пузырьки воздуха (анимация на GPU), планктон, пыль
       ===================================================================== */

    // Пузырьки: высота считается в шейдере как (смещение + время·скорость) mod высота воды,
    // поэтому тысячи частиц не требуют обновлений на CPU
    function createBubbles(count) {
      const vents = crystals.map((cluster) => cluster.group.position).concat([new THREE.Vector3(-0.5, 0, -1.7)]);
      const positions = new Float32Array(count * 3);
      const bottom = new Float32Array(count);
      const speed = new Float32Array(count);
      const size = new Float32Array(count);
      const phase = new Float32Array(count);
      const offset = new Float32Array(count);
      for (let i = 0; i < count; i++) {
        const fromVent = i < count * 0.6;
        const vent = vents[i % vents.length];
        const x = fromVent ? vent.x + rand(-0.18, 0.18) : rand(-HALF.x + 0.5, HALF.x - 0.5);
        const z = fromVent ? vent.z + rand(-0.18, 0.18) : rand(-HALF.z + 0.5, HALF.z - 0.5);
        positions.set([x, 0, z], i * 3);
        bottom[i] = sandHeight(x, z) + 0.1;
        speed[i] = fromVent ? rand(0.55, 1.0) : rand(0.25, 0.6);
        size[i] = fromVent ? rand(0.04, 0.1) : rand(0.025, 0.07);
        phase[i] = rand(0, Math.PI * 2);
        offset[i] = rand(0, 20);
      }
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('aBottom', new THREE.BufferAttribute(bottom, 1));
      geometry.setAttribute('aSpeed', new THREE.BufferAttribute(speed, 1));
      geometry.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
      geometry.setAttribute('aPhase', new THREE.BufferAttribute(phase, 1));
      geometry.setAttribute('aOffset', new THREE.BufferAttribute(offset, 1));

      const material = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        uniforms: {
          uTime,
          uScale: uPointScale,
          uTop: { value: WATER_LEVEL - 0.02 },
          uColorA: { value: new THREE.Color('#9ff8ff') },
          uColorB: { value: new THREE.Color('#d59bff') },
        },
        vertexShader: /* glsl */ `
          uniform float uTime;
          uniform float uScale;
          uniform float uTop;
          attribute float aBottom;
          attribute float aSpeed;
          attribute float aSize;
          attribute float aPhase;
          attribute float aOffset;
          varying float vAlpha;
          varying float vTint;
          void main() {
            float range = uTop - aBottom;
            float travel = mod(aOffset + uTime * aSpeed, range);
            float k = travel / range;                      // 0 — дно, 1 — поверхность
            vec3 p = position;
            float wobble = 0.03 + 0.09 * k;                // покачивание усиливается к поверхности
            p.x += sin(uTime * 2.3 + aPhase + travel * 2.5) * wobble;
            p.z += cos(uTime * 1.9 + aPhase * 1.7 + travel * 2.1) * wobble;
            p.y = aBottom + travel;
            vec4 mv = modelViewMatrix * vec4(p, 1.0);
            gl_Position = projectionMatrix * mv;
            gl_PointSize = min(aSize * (0.75 + 0.6 * k) * uScale / -mv.z, 64.0);   // пузырёк растёт при подъёме
            vAlpha = smoothstep(0.0, 0.08, k) * (1.0 - smoothstep(0.86, 1.0, k));
            vTint = fract(aPhase * 0.618);
          }`,
        fragmentShader: /* glsl */ `
          uniform vec3 uColorA;
          uniform vec3 uColorB;
          varying float vAlpha;
          varying float vTint;
          void main() {
            vec2 c = gl_PointCoord - 0.5;
            float d = length(c);
            if (d > 0.5) discard;
            float rim = smoothstep(0.28, 0.46, d) * (1.0 - smoothstep(0.46, 0.5, d));
            float body = (1.0 - smoothstep(0.0, 0.5, d)) * 0.18;
            float spark = 1.0 - smoothstep(0.0, 0.11, length(c - vec2(-0.14, -0.14)));
            gl_FragColor = vec4(mix(uColorA, uColorB, vTint), (rim * 0.9 + body + spark * 0.9) * vAlpha);
          }`,
      });
      const points = new THREE.Points(geometry, material);
      points.frustumCulled = false;   // реальные координаты известны только в шейдере
      return points;
    }
    scene.add(createBubbles(420));

    // Светящиеся частицы с медленным дрейфом и мерцанием: планктон внутри и «пыль» вокруг
    function createGlowParticles(count, place, sizeRange, drift, colors) {
      const positions = new Float32Array(count * 3);
      const tint = new Float32Array(count * 3);
      const size = new Float32Array(count);
      const phase = new Float32Array(count);
      const p = new THREE.Vector3();
      const c = new THREE.Color();
      for (let i = 0; i < count; i++) {
        place(p);
        positions.set([p.x, p.y, p.z], i * 3);
        c.set(colors[i % colors.length]);
        tint.set([c.r, c.g, c.b], i * 3);
        size[i] = rand(sizeRange[0], sizeRange[1]);
        phase[i] = rand(0, Math.PI * 2);
      }
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('aColor', new THREE.BufferAttribute(tint, 3));
      geometry.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
      geometry.setAttribute('aPhase', new THREE.BufferAttribute(phase, 1));
      const material = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        uniforms: { uTime, uScale: uPointScale, uDrift: { value: drift } },
        vertexShader: /* glsl */ `
          uniform float uTime;
          uniform float uScale;
          uniform float uDrift;
          attribute vec3 aColor;
          attribute float aSize;
          attribute float aPhase;
          varying vec3 vColor;
          varying float vAlpha;
          void main() {
            vec3 p = position;
            p.x += sin(uTime * 0.21 + aPhase * 3.1) * uDrift;
            p.y += sin(uTime * 0.17 + aPhase * 1.7) * uDrift * 0.6;
            p.z += cos(uTime * 0.19 + aPhase * 2.3) * uDrift;
            vec4 mv = modelViewMatrix * vec4(p, 1.0);
            gl_Position = projectionMatrix * mv;
            float dist = -mv.z;
            // у самой камеры точка раздулась бы на весь экран: ограничиваем размер и гасим её
            gl_PointSize = clamp(aSize * uScale / dist, 1.0, 40.0);
            vColor = aColor;
            vAlpha = (0.35 + 0.65 * pow(0.5 + 0.5 * sin(uTime * 1.7 + aPhase * 7.0), 3.0)) * smoothstep(2.0, 7.0, dist);
          }`,
        fragmentShader: /* glsl */ `
          varying vec3 vColor;
          varying float vAlpha;
          void main() {
            float a = 1.0 - smoothstep(0.0, 0.5, length(gl_PointCoord - 0.5));
            gl_FragColor = vec4(vColor, a * a * vAlpha);
          }`,
      });
      const points = new THREE.Points(geometry, material);
      points.frustumCulled = false;
      return points;
    }

    scene.add(createGlowParticles(
      260,
      (p) => p.set(rand(-HALF.x + 0.5, HALF.x - 0.5), rand(SAND_LEVEL + 0.5, WATER_LEVEL - 0.4), rand(-HALF.z + 0.5, HALF.z - 0.5)),
      [0.025, 0.06], 0.25, [PALETTE.cyan, PALETTE.magenta, PALETTE.aqua, '#ffffff'],
    ));
    scene.add(createGlowParticles(
      500,
      (p) => {
        const r = rand(14, 60), a = rand(0, Math.PI * 2);
        return p.set(Math.cos(a) * r, rand(FLOOR_Y + 0.5, 25), Math.sin(a) * r);
      },
      [0.08, 0.25], 1.2, ['#3a5cff', '#7a3cff', '#1fa8c0'],
    ));

    /* =====================================================================
       7. ОБИТАТЕЛИ: процедурные неоновые рыбы и биолюминесцентная медуза
       ===================================================================== */

    const MAX_PITCH = Math.atan(0.45);   // рыбы не плывут «свечкой»
    const MAX_BANK = 0.6;                // максимальный крен в вираже
    const WAVE_K = 4.2;                  // «длина волны» изгиба тела

    const FISH_SPECIES = [
      { length: 1.35, radius: 0.26, tall: 1.0, colors: ['#5ffbff', '#2449ff'], fin: '#4fe9ff', tail: 'veil', dorsal: [0.5, 0.3], anal: null, speed: 1.0, bands: 0, spots: true },
      { length: 1.5, radius: 0.19, tall: 0.95, colors: ['#ff6be0', '#7a2cff'], fin: '#ff5ce6', tail: 'fork', dorsal: [0.32, 0.2], anal: [0.22, 0.13], speed: 1.35, bands: 4, spots: false },
      { length: 1.0, radius: 0.26, tall: 1.6, colors: ['#ffe14d', '#ff3d6e'], fin: '#ffb03b', tail: 'fan', dorsal: [0.55, 0.55], anal: [0.45, 0.45], speed: 0.8, bands: 3, spots: false },
      { length: 1.2, radius: 0.21, tall: 1.05, colors: ['#c4ff4d', '#12e0a4'], fin: '#9dff6b', tail: 'fork', dorsal: [0.38, 0.24], anal: null, speed: 1.15, bands: 0, spots: true },
    ];

    // Профиль тела: u = 0 — кончик хвоста, u = 1 — нос; самая толстая часть ближе к голове
    const bodyProfile = (u) => Math.pow(Math.max(Math.sin(Math.PI * Math.pow(u, 1.45)), 0), 0.72);

    // Полупрозрачная мембрана плавника с лучами (белая — цвет задаёт материал)
    const FIN_TEXTURE = makeCanvasTexture(128, 128, (ctx, w, h) => {
      const fill = ctx.createLinearGradient(0, 0, w, 0);
      fill.addColorStop(0, 'rgba(255, 255, 255, 0.6)');
      fill.addColorStop(1, 'rgba(255, 255, 255, 0.12)');
      ctx.fillStyle = fill;
      ctx.fillRect(0, 0, w, h);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.lineWidth = 1.4;
      for (let i = 0; i <= 14; i++) {
        const y = (i / 14) * h;
        ctx.beginPath();
        ctx.moveTo(0, h / 2 + (y - h / 2) * 0.15);
        ctx.quadraticCurveTo(w * 0.5, h / 2 + (y - h / 2) * 0.6, w, y);
        ctx.stroke();
      }
    });

    // Окраска тела. Холст: по горизонтали — обхват (0.5 — спина), по вертикали — длина (верх — голова)
    function createFishSkin({ colors, bands, spots }) {
      return makeCanvasTexture(256, 128, (ctx, w, h) => {
        const body = ctx.createLinearGradient(0, 0, 0, h);
        body.addColorStop(0, colors[0]);
        body.addColorStop(1, colors[1]);
        ctx.fillStyle = body;
        ctx.fillRect(0, 0, w, h);

        const back = ctx.createLinearGradient(0, 0, w, 0);
        back.addColorStop(0, 'rgba(255, 255, 255, 0.25)');
        back.addColorStop(0.3, 'rgba(0, 0, 0, 0.05)');
        back.addColorStop(0.5, 'rgba(0, 0, 0, 0.7)');
        back.addColorStop(0.7, 'rgba(0, 0, 0, 0.05)');
        back.addColorStop(1, 'rgba(255, 255, 255, 0.25)');
        ctx.fillStyle = back;
        ctx.fillRect(0, 0, w, h);

        ctx.fillStyle = 'rgba(0, 0, 12, 0.6)';
        for (let i = 0; i < bands; i++) ctx.fillRect(0, h * (0.24 + (i / bands) * 0.6), w, h * 0.055);

        // самые яркие элементы: неоновая боковая линия и точки-фотофоры
        ctx.globalCompositeOperation = 'lighter';
        ctx.shadowColor = '#ffffff';
        ctx.shadowBlur = 8;
        ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
        for (const u of [0.25, 0.75]) ctx.fillRect(w * u - 1.5, h * 0.14, 3, h * 0.74);
        const dot = (x, y, r) => {
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fill();
        };
        for (let i = 0; i < 8; i++) for (const u of [0.1, 0.9]) dot(w * u, h * (0.24 + i * 0.08), 2.2);
        if (spots) for (let i = 0; i < 24; i++) dot(rand(0, w), rand(h * 0.15, h * 0.88), rand(1.5, 3.2));
      });
    }

    // Формы плавников (2D-контуры: x — назад от основания, y — вверх)
    function tailShape(type, L) {
      const s = new THREE.Shape();
      if (type === 'veil') {            // длинный вуалевый
        const len = L * 0.62, h = L * 0.42;
        s.moveTo(0, h * 0.1);
        s.bezierCurveTo(len * 0.35, h * 1.05, len * 0.85, h * 0.95, len, h * 0.35);
        s.quadraticCurveTo(len * 0.8, 0, len, -h * 0.35);
        s.bezierCurveTo(len * 0.85, -h * 0.95, len * 0.35, -h * 1.05, 0, -h * 0.1);
      } else if (type === 'fork') {     // вильчатый
        const len = L * 0.42, h = L * 0.34;
        s.moveTo(0, h * 0.1);
        s.quadraticCurveTo(len * 0.45, h * 0.35, len, h);
        s.quadraticCurveTo(len * 0.7, h * 0.25, len * 0.55, 0);
        s.quadraticCurveTo(len * 0.7, -h * 0.25, len, -h);
        s.quadraticCurveTo(len * 0.45, -h * 0.35, 0, -h * 0.1);
      } else {                          // веерный
        const len = L * 0.4, h = L * 0.36;
        s.moveTo(0, h * 0.1);
        s.quadraticCurveTo(len * 0.55, h * 0.9, len, h * 0.6);
        s.quadraticCurveTo(len * 1.2, 0, len, -h * 0.6);
        s.quadraticCurveTo(len * 0.55, -h * 0.9, 0, -h * 0.1);
      }
      s.closePath();
      return s;
    }

    function sailShape(len, h) {        // спинной (h > 0) или анальный (h < 0) плавник
      const s = new THREE.Shape();
      s.moveTo(0, 0);
      s.quadraticCurveTo(len * 0.05, h * 0.85, len * 0.4, h);
      s.quadraticCurveTo(len * 0.95, h * 0.95, len * 1.15, h * 0.2);
      s.lineTo(len * 0.85, 0);
      s.closePath();
      return s;
    }

    function pectoralShape(len, w) {
      const s = new THREE.Shape();
      s.moveTo(0, 0);
      s.quadraticCurveTo(len * 0.3, w, len, w * 0.55);
      s.quadraticCurveTo(len * 0.75, -w * 0.15, 0, 0);
      return s;
    }

    // Плавник = светящаяся мембрана (аддитивное смешивание) + неоновый контур
    function createFin(shape, color, raysAlongY = false) {
      const geometry = new THREE.ShapeGeometry(shape, 16);
      const pos = geometry.attributes.position;
      const uv = geometry.attributes.uv;
      geometry.computeBoundingBox();
      const { min, max } = geometry.boundingBox;
      const maxAbsY = Math.max(Math.abs(min.y), Math.abs(max.y));
      for (let i = 0; i < pos.count; i++) {
        const along = (pos.getX(i) - min.x) / (max.x - min.x);
        if (raysAlongY) uv.setXY(i, Math.abs(pos.getY(i)) / maxAbsY, along);   // лучи растут от спины
        else uv.setXY(i, along, (pos.getY(i) - min.y) / (max.y - min.y));
      }
      geometry.rotateY(Math.PI / 2);   // плоскость XY → YZ, плавник тянется назад (−Z)

      const membrane = new THREE.Mesh(geometry, new THREE.MeshBasicMaterial({
        color,
        map: FIN_TEXTURE,
        transparent: true,
        opacity: 0.9,
        side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      }));
      const outlineGeometry = new THREE.BufferGeometry().setFromPoints(
        shape.getPoints(24).map((p) => new THREE.Vector3(p.x, p.y, 0)),
      );
      outlineGeometry.rotateY(Math.PI / 2);
      const outline = new THREE.LineLoop(outlineGeometry, new THREE.LineBasicMaterial({
        color: color.clone().multiplyScalar(2.5),
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      }));
      const fin = new THREE.Group();
      fin.add(membrane, outline);
      return fin;
    }

    // Временные объекты для расчётов без аллокаций в каждом кадре
    const UP = new THREE.Vector3(0, 1, 0);
    const FORWARD = new THREE.Vector3(0, 0, 1);
    const ORIGIN = new THREE.Vector3();
    const _dir = new THREE.Vector3();
    const _acc = new THREE.Vector3();
    const _diff = new THREE.Vector3();
    const _ahead = new THREE.Vector3();
    const _wall = new THREE.Vector3();
    const _localVelocity = new THREE.Vector3();
    const _matrix = new THREE.Matrix4();
    const _quat = new THREE.Quaternion();
    const _bankQuat = new THREE.Quaternion();
    const _inverseQuat = new THREE.Quaternion();

    class Fish {
      constructor(spec) {
        this.isFish = true;
        this.spec = spec;
        this.length = spec.length;
        this.radius = spec.length * 0.6;             // «личное пространство» для separation
        this.cruiseSpeed = 0.75 * spec.speed;
        this.maxSpeed = 1.25 * spec.speed;
        this.minSpeed = 0.3 * spec.speed;
        this.maxForce = 1.4;
        this.tailFrequency = 6.5 / Math.sqrt(spec.length);   // мелкие рыбы машут чаще
        this.swimPhase = rand(0, Math.PI * 2);
        this.seed = random();
        this.amplitude = 0;
        this.turnRate = 0;
        this.bank = 0;

        this.group = new THREE.Group();
        this.buildModel();
        this.measureBounds();

        this.position = randomPointIn(this.bounds, 0.2);
        this.velocity = new THREE.Vector3(rand(-1, 1), 0, rand(-1, 1)).setLength(this.cruiseSpeed);
        this.heading = Math.atan2(this.velocity.x, this.velocity.z);
        this.target = new THREE.Vector3();
        this.pickTarget();

        this.group.position.copy(this.position);
        this.orient(10);   // сразу разворачиваем по курсу
      }

      get center() {
        return this.position;
      }

      buildModel() {
        const { length: L, radius: R, tall, fin, colors } = this.spec;
        const LAT = 0.62;   // тело сжато с боков
        const radiusAt = (u) => R * bodyProfile(u);
        const zAt = (u) => (u - 0.5) * L;
        this.halfLength = L / 2;

        // Тело: поверхность вращения по профилю, повёрнутая носом в +Z
        const profile = [];
        for (let i = 0; i <= 32; i++) profile.push(new THREE.Vector2(radiusAt(i / 32), zAt(i / 32)));
        const geometry = new THREE.LatheGeometry(profile, 28);
        geometry.rotateX(Math.PI / 2);
        geometry.scale(LAT, tall, 1);
        this.bodyPositions = geometry.attributes.position;
        this.basePositions = this.bodyPositions.array.slice();

        const skin = createFishSkin(this.spec);
        this.body = new THREE.Mesh(geometry, new THREE.MeshPhysicalMaterial({
          map: skin,
          emissive: '#ffffff',
          emissiveMap: skin,
          emissiveIntensity: 0.7,
          roughness: 0.3,
          metalness: 0.15,
          clearcoat: 1,
          clearcoatRoughness: 0.2,
          iridescence: 0.7,
          iridescenceIOR: 1.5,
        }));
        this.body.castShadow = true;
        this.group.add(this.body);

        const finColor = new THREE.Color(fin);

        // Хвостовой плавник на «шарнире»: им машем через sin() в animateSwim()
        this.tailS = 0.94;   // координата вдоль тела: 0 — нос, 1 — хвост
        this.tail = new THREE.Group();
        this.tail.position.z = -this.halfLength + 0.06 * L;
        this.tail.add(createFin(tailShape(this.spec.tail, L), finColor));
        this.group.add(this.tail);

        // Спинной и анальный плавники следуют за изгибом тела
        this.sails = [];
        const addSail = ([len, h], u, sign) => {
          const sail = createFin(sailShape(len * L, sign * h * L), finColor, true);
          sail.position.set(0, sign * radiusAt(u) * tall * 0.85, zAt(u));
          this.sails.push({ mesh: sail, s: 1 - u + len * 0.5 });
          this.group.add(sail);
        };
        if (this.spec.dorsal) addSail(this.spec.dorsal, 0.66, 1);
        if (this.spec.anal) addSail(this.spec.anal, 0.45, -1);

        // Грудные плавники
        this.pectorals = [];
        for (const side of [1, -1]) {
          const pivot = new THREE.Group();
          pivot.position.set(side * radiusAt(0.7) * LAT * 0.8, -radiusAt(0.7) * tall * 0.35, zAt(0.7));
          pivot.add(createFin(pectoralShape(L * 0.26, L * 0.1), finColor));
          pivot.userData.side = side;
          this.pectorals.push(pivot);
          this.group.add(pivot);
        }

        // Светящиеся глаза
        const eyeGeometry = new THREE.SphereGeometry(1, 16, 12);
        const eyeMaterial = new THREE.MeshBasicMaterial({
          color: new THREE.Color(colors[0]).lerp(new THREE.Color('#ffffff'), 0.6).multiplyScalar(1.6),
        });
        const pupilMaterial = new THREE.MeshBasicMaterial({ color: '#020208' });
        for (const side of [1, -1]) {
          const eye = new THREE.Mesh(eyeGeometry, eyeMaterial);
          eye.scale.setScalar(R * 0.2);
          eye.position.set(side * radiusAt(0.83) * LAT * 0.8, radiusAt(0.83) * tall * 0.25, zAt(0.83));
          const pupil = new THREE.Mesh(eyeGeometry, pupilMaterial);
          pupil.scale.setScalar(0.55);
          pupil.position.set(side * 0.6, 0.05, 0.2);
          eye.add(pupil);
          this.group.add(eye);
        }
      }

      // Габариты модели при крайних наклонах → индивидуальные границы, внутри которых
      // рыба целиком (с хвостом и плавниками) не касается стекла, дна и поверхности
      measureBounds() {
        const total = new THREE.Box3();
        const part = new THREE.Box3();
        for (const pitch of [-MAX_PITCH, 0, MAX_PITCH]) {
          for (const roll of [-MAX_BANK, 0, MAX_BANK]) {
            this.group.rotation.set(pitch, 0, roll);
            this.group.updateMatrixWorld(true);
            total.union(part.setFromObject(this.group, true));
          }
        }
        this.group.rotation.set(0, 0, 0);
        // радиус в плоскости XZ, который не превышается при любом курсе (+ запас на изгиб хвоста)
        const reach = Math.hypot(Math.max(-total.min.x, total.max.x), Math.max(-total.min.z, total.max.z)) + 0.15;
        this.bounds = new THREE.Box3(
          new THREE.Vector3(-HALF.x + reach, SWIM_FLOOR - total.min.y, -HALF.z + reach),
          new THREE.Vector3(HALF.x - reach, SWIM_CEILING - total.max.y, HALF.z - reach),
        );
      }

      pickTarget() {
        for (let attempt = 0; attempt < 8; attempt++) {
          randomPointIn(this.bounds, 0.3, this.target);
          if (this.target.distanceTo(this.position) > 2.5) break;
        }
        this.retargetIn = rand(4, 9);
      }

      // Боковое смещение оси тела в точке s (0 — нос, 1 — хвост): бегущая синусоида,
      // амплитуда растёт к хвосту
      waveAt(s) {
        return Math.sin(this.swimPhase - s * WAVE_K) * this.amplitude * s * s;
      }

      slopeAt(s) {
        const ds = 0.02;
        return (this.waveAt(s) - this.waveAt(s - ds)) / (ds * this.length);
      }

      update(dt, time, neighbors) {
        // 1) Блуждание: плывём к случайной точке в своих границах, периодически выбирая новую
        this.retargetIn -= dt;
        if (this.retargetIn <= 0 || this.position.distanceToSquared(this.target) < 1) this.pickTarget();
        const cruise = this.cruiseSpeed * (1 + 0.25 * Math.sin(time * 0.5 + this.seed * 10));
        _dir.subVectors(this.target, this.position).setLength(cruise);
        _acc.subVectors(_dir, this.velocity).clampLength(0, this.maxForce);

        // 2) Стайные правила: держим дистанцию (separation) и слегка выравниваем курс (alignment)
        for (const other of neighbors) {
          if (other === this) continue;
          _diff.subVectors(this.position, other.center);
          const dist = _diff.length();
          const personal = this.radius + other.radius;
          if (dist < personal && dist > 1e-4) {
            _acc.addScaledVector(_diff, (((personal - dist) / personal) * this.maxForce * 2.5) / dist);
          } else if (other.isFish && dist < 3) {
            _acc.addScaledVector(other.velocity, 0.1);
          }
        }

        // 3) Упреждающий разворот у стекла, дна и поверхности
        _ahead.copy(this.position).addScaledVector(this.velocity, 0.8);
        _acc.add(wallForce(_ahead, this.bounds, 1.2, this.maxForce * 2, _wall));

        // 4) Интегрирование: ограничиваем наклон траектории и скорость
        this.velocity.addScaledVector(_acc, dt);
        if (Math.hypot(this.velocity.x, this.velocity.z) < 0.05) {
          this.velocity.x += Math.sin(this.heading) * 0.1;
          this.velocity.z += Math.cos(this.heading) * 0.1;
        }
        const maxRise = Math.tan(MAX_PITCH) * Math.hypot(this.velocity.x, this.velocity.z);
        this.velocity.y = THREE.MathUtils.clamp(this.velocity.y, -maxRise, maxRise);
        const speed = THREE.MathUtils.clamp(this.velocity.length(), this.minSpeed, this.maxSpeed);
        this.velocity.setLength(speed);
        this.position.addScaledVector(this.velocity, dt);
        this.bounds.clampPoint(this.position, this.position);   // жёсткая страховка: стекло непроницаемо
        this.group.position.copy(this.position);

        // 5) Плавный поворот по курсу + крен в виражах
        const heading = Math.atan2(this.velocity.x, this.velocity.z);
        const deltaHeading = Math.atan2(Math.sin(heading - this.heading), Math.cos(heading - this.heading));
        this.heading = heading;
        if (dt > 0) this.turnRate = THREE.MathUtils.damp(this.turnRate, deltaHeading / dt, 4, dt);
        this.orient(dt);

        // 6) Анимация плавания
        this.animateSwim(dt, speed);
      }

      orient(dt) {
        _dir.copy(this.velocity).normalize();
        _matrix.lookAt(_dir, ORIGIN, UP);   // ось +Z модели → вектор скорости
        _quat.setFromRotationMatrix(_matrix);
        const targetBank = THREE.MathUtils.clamp(-this.turnRate * 0.4, -MAX_BANK, MAX_BANK);
        this.bank = THREE.MathUtils.damp(this.bank, targetBank, 3, dt);
        _quat.multiply(_bankQuat.setFromAxisAngle(FORWARD, this.bank));
        this.group.quaternion.slerp(_quat, 1 - Math.exp(-5 * dt));
      }

      animateSwim(dt, speed) {
        // частота и размах взмахов растут со скоростью и в крутых виражах
        const speedRatio = speed / this.maxSpeed;
        const turn = Math.min(Math.abs(this.turnRate), 2);
        this.swimPhase += dt * this.tailFrequency * (0.55 + 0.9 * speedRatio + turn * 0.25);
        this.amplitude = THREE.MathUtils.damp(this.amplitude, this.length * (0.06 + 0.06 * speedRatio + turn * 0.025), 4, dt);

        // тело изгибается бегущей волной: каждую вершину сдвигаем вбок по waveAt(s)
        const base = this.basePositions;
        const positions = this.bodyPositions.array;
        for (let i = 0; i < positions.length; i += 3) {
          positions[i] = base[i] + this.waveAt((this.halfLength - base[i + 2]) / this.length);
        }
        this.bodyPositions.needsUpdate = true;

        // хвост повторяет наклон конца тела и дополнительно «хлещет» с запаздыванием фазы
        this.tail.position.x = this.waveAt(this.tailS);
        this.tail.rotation.y = -Math.atan(this.slopeAt(this.tailS)) + Math.sin(this.swimPhase - WAVE_K - 1.2) * 0.3;

        for (const sail of this.sails) {
          sail.mesh.position.x = this.waveAt(sail.s);
          sail.mesh.rotation.y = -Math.atan(this.slopeAt(sail.s));
        }

        // грудные плавники гребут в такт, вдвое медленнее хвоста
        const flap = Math.sin(this.swimPhase * 0.5) * 0.35;
        for (const pivot of this.pectorals) pivot.rotation.z = -pivot.userData.side * (Math.PI / 2 + 0.45 + flap);
      }
    }

    class Jellyfish {
      constructor(color) {
        this.color = new THREE.Color(color);
        this.bellRadius = 0.62;
        this.radius = 1.1;   // рыбы обходят медузу стороной
        this.bounds = JELLY_BOUNDS;
        this.position = randomPointIn(this.bounds, 0.3);
        this.center = this.position.clone();
        this.velocity = new THREE.Vector3();
        this.axis = new THREE.Vector3(0, 1, 0);
        this.target = new THREE.Vector3();
        this.pulsePhase = rand(0, Math.PI * 2);
        this.group = new THREE.Group();
        this.buildModel();
        this.pickTarget();
        this.group.position.copy(this.position);
      }

      buildModel() {
        const R = this.bellRadius;

        // Купол: френель (прозрачный центр, яркие края), радиальные каналы и светящаяся кайма
        this.bellUniforms = {
          uTime,
          uPulse: { value: 0 },
          uRadius: { value: R },
          uColor: { value: this.color },
          uRim: { value: new THREE.Color('#ff7bf0') },
        };
        this.bell = new THREE.Mesh(
          new THREE.SphereGeometry(R, 48, 24, 0, Math.PI * 2, 0, Math.PI * 0.55),
          new THREE.ShaderMaterial({
            uniforms: this.bellUniforms,
            transparent: true,
            depthWrite: false,
            side: THREE.DoubleSide,
            blending: THREE.AdditiveBlending,
            vertexShader: /* glsl */ `
              varying vec3 vNormalW;
              varying vec3 vViewDir;
              varying vec3 vLocal;
              void main() {
                vLocal = position;
                vec4 wp = modelMatrix * vec4(position, 1.0);
                vNormalW = normalize(mat3(modelMatrix) * normal);
                vViewDir = cameraPosition - wp.xyz;
                gl_Position = projectionMatrix * viewMatrix * wp;
              }`,
            fragmentShader: /* glsl */ `
              uniform float uTime;
              uniform float uPulse;
              uniform float uRadius;
              uniform vec3 uColor;
              uniform vec3 uRim;
              varying vec3 vNormalW;
              varying vec3 vViewDir;
              varying vec3 vLocal;
              void main() {
                float fresnel = pow(1.0 - abs(dot(normalize(vNormalW), normalize(vViewDir))), 2.0);
                float y = vLocal.y / uRadius;                     // 1 — макушка, < 0 — край купола
                float angle = atan(vLocal.z, vLocal.x);
                float canals = pow(abs(sin(angle * 4.0)), 40.0) * smoothstep(0.0, 0.8, y);
                float rim = 1.0 - smoothstep(-0.16, 0.12, y);
                float spots = smoothstep(0.75, 1.0, sin(angle * 12.0 + uTime) * sin(y * 18.0 - uTime * 1.5)) * 0.4;
                vec3 color = uColor * (0.1 + fresnel * 1.2 + canals * 0.5 + spots) + uRim * rim * 1.5;
                gl_FragColor = vec4(color * (0.75 + uPulse * 0.6), 1.0);
              }`,
          }),
        );
        this.group.add(this.bell);

        // Светящееся ядро и четыре кольца-гонады (сокращаются вместе с куполом)
        const coreMaterial = new THREE.MeshBasicMaterial({
          color: this.color.clone().multiplyScalar(2.2),
          transparent: true,
          opacity: 0.8,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
        });
        const core = new THREE.Mesh(new THREE.SphereGeometry(R * 0.28, 20, 12), coreMaterial);
        core.position.y = R * 0.3;
        this.bell.add(core);
        const ringGeometry = new THREE.TorusGeometry(R * 0.16, R * 0.035, 8, 24);
        for (let i = 0; i < 4; i++) {
          const a = (i / 4) * Math.PI * 2 + Math.PI / 4;
          const ring = new THREE.Mesh(ringGeometry, coreMaterial);
          ring.position.set(Math.cos(a) * R * 0.3, R * 0.45, Math.sin(a) * R * 0.3);
          ring.rotation.x = Math.PI / 2;
          this.bell.add(ring);
        }

        // Щупальца: одна геометрия на линию и «бусины»-фотофоры; вершины пересчитываются каждый кадр
        const beadTexture = makeCanvasTexture(64, 64, (ctx, w, h) => {
          const g = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
          g.addColorStop(0, 'rgba(255, 255, 255, 1)');
          g.addColorStop(0.35, 'rgba(255, 255, 255, 0.45)');
          g.addColorStop(1, 'rgba(255, 255, 255, 0)');
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, w, h);
        });
        const lineMaterial = new THREE.LineBasicMaterial({
          vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
        });
        const beadMaterial = new THREE.PointsMaterial({
          size: 0.09, map: beadTexture, vertexColors: true, transparent: true,
          blending: THREE.AdditiveBlending, depthWrite: false,
        });
        const tipColor = new THREE.Color('#5ff6ff');
        this.tentacles = [];
        for (let k = 0; k < 12; k++) {
          const segments = 30;
          const colors = new Float32Array(segments * 3);
          const c = new THREE.Color();
          for (let i = 0; i < segments; i++) {
            const t = i / (segments - 1);
            c.copy(this.color).lerp(tipColor, t).multiplyScalar(1.6 * (1 - t) ** 1.5 + 0.05);   // к кончику гаснет
            colors.set([c.r, c.g, c.b], i * 3);
          }
          const geometry = new THREE.BufferGeometry();
          geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(segments * 3), 3));
          geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
          const line = new THREE.Line(geometry, lineMaterial);
          const beads = new THREE.Points(geometry, beadMaterial);
          line.frustumCulled = beads.frustumCulled = false;
          this.group.add(line, beads);
          this.tentacles.push({ geometry, segments, angle: (k / 12) * Math.PI * 2 + rand(-0.1, 0.1), length: rand(0.9, 1.3) });
        }

        // Ротовые лопасти — те же светящиеся ленты, что у водорослей, только свисают вниз
        const armMaterial = createKelpMaterial('#ff7bf0');
        for (let i = 0; i < 4; i++) {
          const armGeometry = createRibbonGeometry(1.0, 0.16, 5);
          armGeometry.rotateX(Math.PI);
          const arm = new THREE.Mesh(armGeometry, armMaterial);
          arm.rotation.y = (i / 4) * Math.PI * 2;
          this.group.add(arm);
        }

        // Биолюминесценция подсвечивает дно и рыб вокруг
        this.light = new THREE.PointLight(this.color, 4, 6, 2);
        this.light.position.y = R * 0.3;
        this.group.add(this.light);
      }

      pickTarget() {
        randomPointIn(this.bounds, 0.2, this.target);
        this.retargetIn = rand(7, 12);
      }

      update(dt, time) {
        // Пульсация: быстрое сокращение купола даёт толчок вдоль оси, затем — расслабление
        this.pulsePhase += dt * 1.9;
        const contraction = Math.pow(Math.max(Math.sin(this.pulsePhase), 0), 1.6);

        this.retargetIn -= dt;
        if (this.retargetIn <= 0 || this.position.distanceToSquared(this.target) < 0.5) this.pickTarget();

        // Ось купола плавно клонится к цели, но не больше ~35° от вертикали
        _dir.subVectors(this.target, this.position).normalize();
        _dir.y = Math.max(_dir.y, 1.4);
        this.axis.lerp(_dir.normalize(), 1 - Math.exp(-0.8 * dt)).normalize();

        const wantsUp = this.target.y > this.position.y - 0.2;
        this.velocity.addScaledVector(this.axis, contraction * (wantsUp ? 1.25 : 0.35) * dt);
        this.velocity.y -= 0.12 * dt;                         // медленное погружение
        this.velocity.multiplyScalar(Math.exp(-1.1 * dt));    // вязкость воды
        this.velocity.addScaledVector(wallForce(this.position, this.bounds, 0.8, 0.5, _wall), dt);
        this.position.addScaledVector(this.velocity, dt);
        this.bounds.clampPoint(this.position, this.position);

        this.group.position.copy(this.position);
        this.group.quaternion.slerp(_quat.setFromUnitVectors(UP, this.axis), 1 - Math.exp(-2 * dt));
        this.center.copy(this.position).y -= 0.5;

        // Купол и свечение синхронны с пульсацией
        this.bell.scale.set(1 - 0.16 * contraction, 0.78 + 0.16 * contraction, 1 - 0.16 * contraction);
        this.bellUniforms.uPulse.value = contraction;
        this.light.intensity = 3 + 3 * contraction;

        // Щупальца: синусоидальная волна + отставание от движения (в локальных координатах медузы)
        _localVelocity.copy(this.velocity).applyQuaternion(_inverseQuat.copy(this.group.quaternion).invert());
        const rimRadius = this.bellRadius * 0.92 * (1 - 0.16 * contraction);
        for (let k = 0; k < this.tentacles.length; k++) {
          const tentacle = this.tentacles[k];
          const positions = tentacle.geometry.attributes.position.array;
          const baseX = Math.cos(tentacle.angle) * rimRadius;
          const baseZ = Math.sin(tentacle.angle) * rimRadius;
          for (let i = 0; i < tentacle.segments; i++) {
            const t = i / (tentacle.segments - 1);
            const inward = 1 - 0.45 * t;
            const trail = t * t * 0.9;
            positions[i * 3] = baseX * inward + Math.sin(time * 1.7 - t * 6 + k * 1.3) * 0.16 * t - _localVelocity.x * trail;
            positions[i * 3 + 1] = -0.07 - t * tentacle.length * (1 + 0.15 * contraction);
            positions[i * 3 + 2] = baseZ * inward + Math.cos(time * 1.2 - t * 4.5 + k * 0.7) * 0.12 * t - _localVelocity.z * trail;
          }
          tentacle.geometry.attributes.position.needsUpdate = true;
        }
      }
    }

    // Создаём обитателей: 4 рыбы разных видов + медуза
    const fishes = FISH_SPECIES.map((spec) => new Fish(spec));
    const jelly = new Jellyfish(PALETTE.violet);
    const creatures = [...fishes, jelly];
    creatures.forEach((creature) => scene.add(creature.group));

    /* =====================================================================
       8. АНИМАЦИОННЫЙ ЦИКЛ
       ===================================================================== */

    let elapsed = 0;
    let lastFrame = performance.now();

    function animate(now) {
      // dt ограничен: после сворачивания вкладки обитатели не «телепортируются»
      const dt = Math.min(Math.max((now - lastFrame) / 1000, 0), 1 / 20);
      lastFrame = now;
      elapsed += dt;
      uTime.value = elapsed;

      for (const fish of fishes) fish.update(dt, elapsed, creatures);
      jelly.update(dt, elapsed);
      for (const cluster of crystals) cluster.update(elapsed);

      controls.update(dt);
      composer.render(dt);
    }

    /* =====================================================================
       9. АДАПТИВНОСТЬ И ИНТЕРФЕЙС
       ===================================================================== */

    function onResize() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      const pixelRatio = Math.min(window.devicePixelRatio, 2);

      // На узких (портретных) экранах расширяем вертикальный FOV, чтобы аквариум помещался по ширине
      camera.aspect = width / height;
      const halfFov = Math.tan(THREE.MathUtils.degToRad(BASE_FOV / 2)) * Math.max(1, 1.3 / camera.aspect);
      camera.fov = Math.min(THREE.MathUtils.radToDeg(2 * Math.atan(halfFov)), 80);
      camera.updateProjectionMatrix();

      renderer.setPixelRatio(pixelRatio);
      renderer.setSize(width, height, false);
      composer.setPixelRatio(pixelRatio);
      composer.setSize(width, height);

      // Размеры частиц заданы в мировых единицах → переводим в пиксели для текущего экрана
      uPointScale.value = (height * pixelRatio) / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
    }
    window.addEventListener('resize', onResize);
    onResize();

    const autoRotateButton = document.getElementById('autoRotateBtn');
    autoRotateButton.addEventListener('click', () => {
      controls.autoRotate = !controls.autoRotate;
      autoRotateButton.setAttribute('aria-pressed', String(controls.autoRotate));
    });

    renderer.setAnimationLoop(animate);
    window.__aquariumReady = true;
  </script>
</body>
